                    clearInterval(interval);
                }
                return () => clearInterval(interval);

                const totalMB = executorMemoryGB * 1024;
                const reservedMB = 300;
                const usableMB = Math.max(0, totalMB - reservedMB);
                const unifiedPoolMB = usableMB * memoryFraction;
                const userMemoryMB = usableMB * (1 - memoryFraction);
                let storageMB = unifiedPoolMB * storageFraction;
                let executionMB = unifiedPoolMB * (1 - storageFraction);
                if (activeWorkload === 'heavy-join') {
                    const evicted = storageMB * 0.6;
                    storageMB -= evicted;
                    executionMB += evicted;
                } else if (activeWorkload === 'heavy-cache') {
                    storageMB = unifiedPoolMB * 0.5;
                    executionMB = unifiedPoolMB * 0.5;
                }
                return { totalMB, reservedMB, usableMB, userMemoryMB, unifiedPoolMB, storageMB, executionMB, offHeapMB };
            }, [executorMemoryGB, memoryFraction, storageFraction, activeWorkload, offHeapMB]);

            const toggleAnswer = (id) => {
